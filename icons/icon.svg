    </linearGradient>
    <linearGradient id="or" x1="20" y1="30" x2="108" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFA24A"/>
      <stop offset="1" stop-color="#F0502A"/>
