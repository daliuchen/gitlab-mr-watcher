  <circle cx="52" cy="47" r="5.5" fill="#1E1F3F"/>
  <circle cx="52" cy="81" r="5.5" fill="#1E1F3F"/>
  <circle cx="76" cy="81" r="5.5" fill="#F0502A"/>
</svg>
