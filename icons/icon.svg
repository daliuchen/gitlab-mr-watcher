<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">GitLab MR Watcher icon</title>
  <desc id="desc">A compact merge request flow mark with MR initials.</desc>
  <defs>
    <linearGradient id="bg" x1="20" y1="12" x2="108" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#202124"/>
      <stop offset="1" stop-color="#343a46"/>
    </linearGradient>
    <linearGradient id="accent" x1="33" y1="27" x2="101" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8a00"/>
      <stop offset="0.55" stop-color="#fc6d26"/>
      <stop offset="1" stop-color="#e24329"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#111827" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <path d="M28 77V49c0-9 7-16 16-16h7" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
  <path d="M51 33h9c12 0 20 8 20 20v22c0 7 6 13 13 13h7" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <path d="M80 53c0 9-7 16-16 16H44c-9 0-16 7-16 16v10" fill="none" stroke="#ffb000" stroke-width="10" stroke-linecap="round"/>

  <circle cx="28" cy="77" r="12" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="28" cy="77" r="6" fill="#fc6d26"/>
  <circle cx="52" cy="33" r="12" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="52" cy="33" r="6" fill="#ffb000"/>
  <circle cx="100" cy="88" r="12" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="100" cy="88" r="6" fill="#e24329"/>

  <rect x="35" y="82" width="58" height="27" rx="8" fill="#ffffff"/>
  <text x="64" y="102" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="800" letter-spacing="0" fill="#202124">MR</text>
</svg>
